<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ZOMBİ AVI - Multiplayer</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b0f;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #10151a;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, #18231b 0%, #07090b 70%);
    color: white;
}

.panel {
    width: min(420px, 92vw);
    padding: 25px;
    border-radius: 18px;
    background: rgba(15, 20, 24, .96);
    border: 1px solid #34413a;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    text-align: center;
}

.panel h1 {
    margin: 0 0 8px;
    font-size: 34px;
    color: #71e36c;
}

.panel p {
    color: #b8c1c5;
    font-size: 14px;
}

input,
button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
    font-size: 16px;
}

input {
    background: #20282d;
    color: white;
    outline: none;
}

button {
    background: #4caf50;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

.secondary {
    background: #303940;
}

#roomInfo {
    display: none;
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #11171b;
    color: #c9d0d4;
    font-size: 13px;
}

#roomCode {
    color: #70e86b;
    font-weight: bold;
    font-size: 22px;
    letter-spacing: 3px;
}

#status {
    margin-top: 12px;
    color: #f2c94c;
    font-size: 13px;
}

#hud {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 5;
    color: white;
    pointer-events: none;
    user-select: none;
}

.hudBox {
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 10px 13px;
    min-width: 170px;
}

#healthBar {
    width: 150px;
    height: 12px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 5px;
}

#healthFill {
    width: 100%;
    height: 100%;
    background: #50d45a;
}

#mobileControls {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

#joystick {
    position: absolute;
    left: 25px;
    bottom: 28px;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: rgba(255,255,255,.09);
    border: 2px solid rgba(255,255,255,.18);
    pointer-events: auto;
}

#stick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 65px;
    height: 65px;
    margin-left: -32.5px;
    margin-top: -32.5px;
    border-radius: 50%;
    background: rgba(105,220,105,.75);
    border: 2px solid rgba(255,255,255,.4);
}

#fireButton {
    position: absolute;
    right: 30px;
    bottom: 40px;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: rgba(220,60,55,.78);
    border: 3px solid rgba(255,255,255,.35);
    color: white;
    font-weight: bold;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    user-select: none;
}

#aimArea {
    position: absolute;
    right: 0;
    top: 0;
    width: 55%;
    height: 100%;
    pointer-events: auto;
}

#disconnect {
    position: fixed;
    right: 12px;
    top: 12px;
    z-index: 6;
    width: auto;
    padding: 8px 12px;
    margin: 0;
    display: none;
    background: rgba(180,50,50,.85);
    font-size: 12px;
}

@media (pointer: coarse) {
    #mobileControls {
        display: block;
    }
}

@media (max-width: 600px) {
    .panel h1 {
        font-size: 28px;
    }

    .panel {
        padding: 20px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
    <div class="panel">

        <h1>🧟 ZOMBİ AVI</h1>

        <p>
            İki oyunculu online zombi oyunu.<br>
            Bir kişi oda oluşturur, diğer kişi oda koduyla katılır.
        </p>

        <input id="nameInput"
               maxlength="12"
               placeholder="Oyuncu adın">

        <button id="createBtn">
            ODA OLUŞTUR
        </button>

        <div id="roomInfo">
            Oda kodun:
            <div id="roomCode">------</div>
            <small>Bu kodu arkadaşına gönder.</small>
        </div>

        <input id="joinInput"
               maxlength="10"
               placeholder="Oda kodu">

        <button id="joinBtn" class="secondary">
            ODAYA KATIL
        </button>

        <div id="status">
            Bağlantı bekleniyor...
        </div>

    </div>
</div>

<div id="hud">
    <div class="hudBox">
        ❤️ Can:
        <span id="healthText">100</span>

        <div id="healthBar">
            <div id="healthFill"></div>
        </div>

        <div style="margin-top:5px">
            🧟 Zombi:
            <span id="zombieText">0</span>
        </div>
    </div>
</div>

<button id="disconnect">
    ÇIKIŞ
</button>

<div id="mobileControls">

    <div id="aimArea"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="fireButton">
        🔫 ATEŞ
    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   UI
========================================================= */

const menu = document.getElementById("menu");
const createBtn = document.getElementById("createBtn");
const joinBtn = document.getElementById("joinBtn");
const nameInput = document.getElementById("nameInput");
const joinInput = document.getElementById("joinInput");
const roomInfo = document.getElementById("roomInfo");
const roomCode = document.getElementById("roomCode");
const statusText = document.getElementById("status");
const disconnectBtn = document.getElementById("disconnect");

const healthText = document.getElementById("healthText");
const healthFill = document.getElementById("healthFill");
const zombieText = document.getElementById("zombieText");


/* =========================================================
   PEER / MULTIPLAYER
========================================================= */

let peer = null;
let connection = null;

let isHost = false;
let connected = false;

let myId = null;
let playerName = "Oyuncu";

let roomSeed = null;


/* =========================================================
   GAME
========================================================= */

const WORLD_W = 2400;
const WORLD_H = 1600;

let running = false;

let players = {};

let zombies = [];
let bullets = [];

let lastTime = performance.now();
let spawnTimer = 0;
let zombieIdCounter = 1;

let camera = {
    x: 0,
    y: 0
};


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(id, name, x, y) {

    return {
        id,
        name,

        x,
        y,

        radius: 20,

        speed: 230,

        health: 100,
        maxHealth: 100,

        angle: 0,

        shootCooldown: 0,

        alive: true,

        color:
            id === myId
                ? "#55d96a"
                : "#4da6ff"
    };
}


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (
        [
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " "
        ].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
    }

});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


let mouse = {
    x: W / 2,
    y: H / 2,
    down: false
};

canvas.addEventListener("mousemove", e => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

});

canvas.addEventListener("mousedown", e => {

    if (e.button === 0) {
        mouse.down = true;
    }

});

window.addEventListener("mouseup", e => {

    if (e.button === 0) {
        mouse.down = false;
    }

});


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const fireButton = document.getElementById("fireButton");
const aimArea = document.getElementById("aimArea");

let joystickActive = false;

let joyX = 0;
let joyY = 0;

let firePressed = false;

function updateJoystick(clientX, clientY) {

    const rect = joystick.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;

    const max = rect.width * 0.31;

    const distance = Math.hypot(dx, dy);

    if (distance > max) {

        dx = dx / distance * max;
        dy = dy / distance * max;

    }

    joyX = dx / max;
    joyY = dy / max;

    stick.style.transform =
        `translate(${dx}px, ${dy}px)`;
}

function resetJoystick() {

    joystickActive = false;

    joyX = 0;
    joyY = 0;

    stick.style.transform =
        "translate(0px, 0px)";
}


joystick.addEventListener("pointerdown", e => {

    joystickActive = true;

    joystick.setPointerCapture(e.pointerId);

    updateJoystick(
        e.clientX,
        e.clientY
    );

});

joystick.addEventListener("pointermove", e => {

    if (!joystickActive) return;

    updateJoystick(
        e.clientX,
        e.clientY
    );

});

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);


/* =========================================================
   MOBILE AIM
========================================================= */

aimArea.addEventListener("pointermove", e => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

});

aimArea.addEventListener("pointerdown", e => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;

});


/* =========================================================
   MOBILE FIRE
========================================================= */

fireButton.addEventListener("pointerdown", e => {

    e.preventDefault();

    firePressed = true;

    fireButton.setPointerCapture(e.pointerId);

});

fireButton.addEventListener("pointerup", e => {

    e.preventDefault();

    firePressed = false;

});

fireButton.addEventListener("pointercancel", () => {
    firePressed = false;
});


/* =========================================================
   CONNECTION
========================================================= */

function setStatus(text) {
    statusText.textContent = text;
}


function randomRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 6; i++) {

        result +=
            chars[Math.floor(Math.random() * chars.length)];

    }

    return result;
}


/* =========================================================
   CREATE ROOM
========================================================= */

createBtn.addEventListener("click", () => {

    playerName =
        nameInput.value.trim() || "Oyuncu 1";

    isHost = true;

    roomSeed = randomRoomCode();

    setStatus("Oda oluşturuluyor...");

    peer = new Peer(
        "zombi-avi-" + roomSeed,
        {
            debug: 1
        }
    );

    peer.on("open", id => {

        myId = id;

        roomCode.textContent = roomSeed;

        roomInfo.style.display = "block";

        setStatus(
            "Arkadaşının odaya katılmasını bekliyoruz..."
        );

        startHostGame();

    });

    peer.on("connection", conn => {

        if (connection) {

            conn.close();

            return;

        }

        connection = conn;

        setupConnection();

    });

    peer.on("error", err => {

        console.error(err);

        setStatus(
            "Bağlantı hatası: " + err.type
        );

    });

});


/* =========================================================
   JOIN ROOM
========================================================= */

joinBtn.addEventListener("click", () => {

    const code =
        joinInput.value
            .trim()
            .toUpperCase();

    if (!code) {

        setStatus("Oda kodunu gir.");

        return;

    }

    playerName =
        nameInput.value.trim() || "Oyuncu 2";

    isHost = false;

    setStatus("Odaya bağlanılıyor...");

    peer = new Peer({
        debug: 1
    });

    peer.on("open", id => {

        myId = id;

        connection =
            peer.connect(
                "zombi-avi-" + code,
                {
                    reliable: true
                }
            );

        setupConnection();

    });

    peer.on("error", err => {

        console.error(err);

        setStatus(
            "Bağlantı hatası: " + err.type
        );

    });

});


/* =========================================================
   CONNECTION SETUP
========================================================= */

function setupConnection() {

    if (!connection) return;

    connection.on("open", () => {

        connected = true;

        setStatus("Bağlantı kuruldu!");

        disconnectBtn.style.display = "block";

        if (!isHost) {

            connection.send({
                type: "join",
                id: myId,
                name: playerName
            });

        } else {

            connection.send({
                type: "hostInfo",
                players: Object.values(players)
            });

        }

    });


    connection.on("data", data => {

        handleNetworkData(data);

    });


    connection.on("close", () => {

        connected = false;

        setStatus(
            "Diğer oyuncunun bağlantısı kesildi."
        );

    });


    connection.on("error", err => {

        console.error(err);

    });

}


/* =========================================================
   HOST GAME
========================================================= */

function startHostGame() {

    const p =
        createPlayer(
            myId,
            playerName,
            600,
            800
        );

    players[myId] = p;

    running = true;

    menu.style.display = "none";

    spawnInitialZombies();

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   CLIENT GAME
========================================================= */

function startClientGame(hostPlayers) {

    players = {};

    hostPlayers.forEach(p => {

        players[p.id] = p;

    });

    if (!players[myId]) {

        players[myId] =
            createPlayer(
                myId,
                playerName,
                900,
                800
            );

    }

    running = true;

    menu.style.display = "none";

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   NETWORK DATA
========================================================= */

function handleNetworkData(data) {

    if (!data || !data.type) return;


    if (data.type === "join") {

        if (!isHost) return;

        if (Object.keys(players).length >= 2) {

            connection.send({
                type: "full"
            });

            return;

        }

        players[data.id] =
            createPlayer(
                data.id,
                data.name,
                950,
                800
            );

        connection.send({
            type: "initial",
            players: Object.values(players),
            zombies
        });

        return;
    }


    if (data.type === "initial") {

        if (isHost) return;

        startClientGame(data.players);

        zombies = data.zombies || [];

        return;
    }


    if (data.type === "playerState") {

        if (!players[data.id]) {

            players[data.id] =
                createPlayer(
                    data.id,
                    data.name || "Oyuncu",
                    data.x,
                    data.y
                );

        }

        const p = players[data.id];

        p.x = data.x;
        p.y = data.y;
        p.angle = data.angle;
        p.health = data.health;
        p.alive = data.alive;

        return;
    }


    if (data.type === "shoot") {

        if (isHost) {

            hostCreateBullet(
                data.id,
                data.angle
            );

        }

        return;
    }


    if (data.type === "world") {

        if (isHost) return;

        players = data.players || {};
        zombies = data.zombies || [];

        return;
    }

}


/* =========================================================
   SEND PLAYER STATE
========================================================= */

let networkTimer = 0;

function sendPlayerState(dt) {

    networkTimer += dt;

    if (networkTimer < 0.04) return;

    networkTimer = 0;

    if (!connected || !connection) return;

    const p = players[myId];

    if (!p) return;

    connection.send({
        type: "playerState",

        id: myId,

        name: p.name,

        x: p.x,
        y: p.y,

        angle: p.angle,

        health: p.health,

        alive: p.alive
    });

}


/* =========================================================
   SHOOT
========================================================= */

function tryShoot() {

    const p = players[myId];

    if (!p || !p.alive) return;

    if (p.shootCooldown > 0) return;

    p.shootCooldown = 0.22;

    const angle =
        Math.atan2(
            mouse.y - (p.y - camera.y),
            mouse.x - (p.x - camera.x)
        );

    p.angle = angle;


    if (isHost) {

        hostCreateBullet(
            myId,
            angle
        );

    } else if (connection) {

        connection.send({
            type: "shoot",
            id: myId,
            angle
        });

    }

}


/* =========================================================
   HOST BULLET
========================================================= */

function hostCreateBullet(playerId, angle) {

    const p = players[playerId];

    if (!p || !p.alive) return;

    bullets.push({

        id:
            Math.random()
                .toString(36)
                .slice(2),

        owner: playerId,

        x: p.x,
        y: p.y,

        vx: Math.cos(angle) * 650,
        vy: Math.sin(angle) * 650,

        life: 1.2
    });

}


/* =========================================================
   ZOMBIES
========================================================= */

function spawnInitialZombies() {

    for (let i = 0; i < 8; i++) {

        spawnZombie();

    }

}


function spawnZombie() {

    let x;
    let y;

    const side =
        Math.floor(Math.random() * 4);

    if (side === 0) {

        x = Math.random() * WORLD_W;
        y = -40;

    } else if (side === 1) {

        x = WORLD_W + 40;
        y = Math.random() * WORLD_H;

    } else if (side === 2) {

        x = Math.random() * WORLD_W;
        y = WORLD_H + 40;

    } else {

        x = -40;
        y = Math.random() * WORLD_H;

    }

    zombies.push({

        id: zombieIdCounter++,

        x,
        y,

        radius: 19,

        speed: 65 + Math.random() * 25,

        health: 60,

        maxHealth: 60,

        attackCooldown: 0
    });

}


/* =========================================================
   FIND NEAREST PLAYER
========================================================= */

function findNearestPlayer(zombie) {

    let target = null;

    let bestDistance = Infinity;

    for (const id in players) {

        const p = players[id];

        if (!p.alive) continue;

        const d =
            Math.hypot(
                p.x - zombie.x,
                p.y - zombie.y
            );

        if (d < bestDistance) {

            bestDistance = d;
            target = p;

        }

    }

    return target;
}


/* =========================================================
   UPDATE HOST
========================================================= */

function updateHost(dt) {

    /* -------------------------
       PLAYERS
    ------------------------- */

    for (const id in players) {

        const p = players[id];

        if (!p.alive) continue;

        if (id === myId) {

            let dx = 0;
            let dy = 0;


            if (keys["w"] || keys["arrowup"]) {
                dy -= 1;
            }

            if (keys["s"] || keys["arrowdown"]) {
                dy += 1;
            }

            if (keys["a"] || keys["arrowleft"]) {
                dx -= 1;
            }

            if (keys["d"] || keys["arrowright"]) {
                dx += 1;
            }


            if (Math.abs(joyX) > 0.05 ||
                Math.abs(joyY) > 0.05) {

                dx = joyX;
                dy = joyY;

            }


            const length =
                Math.hypot(dx, dy);

            if (length > 0) {

                dx /= length;
                dy /= length;

                p.x +=
                    dx * p.speed * dt;

                p.y +=
                    dy * p.speed * dt;

            }


            p.x =
                Math.max(
                    p.radius,
                    Math.min(
                        WORLD_W - p.radius,
                        p.x
                    )
                );

            p.y =
                Math.max(
                    p.radius,
                    Math.min(
                        WORLD_H - p.radius,
                        p.y
                    )
                );


            if (
                mouse.down ||
                firePressed ||
                keys[" "]
            ) {

                tryShoot();

            }

        }


        p.shootCooldown =
            Math.max(
                0,
                p.shootCooldown - dt
            );

    }


    /* -------------------------
       ZOMBIES
    ------------------------- */

    spawnTimer += dt;

    if (
        spawnTimer > 2 &&
        zombies.length < 35
    ) {

        spawnTimer = 0;

        spawnZombie();

    }


    for (let i = zombies.length - 1; i >= 0; i--) {

        const z = zombies[i];

        const target =
            findNearestPlayer(z);

        if (target) {

            const dx =
                target.x - z.x;

            const dy =
                target.y - z.y;

            const distance =
                Math.hypot(dx, dy);

            if (distance > 42) {

                z.x +=
                    dx / distance *
                    z.speed *
                    dt;

                z.y +=
                    dy / distance *
                    z.speed *
                    dt;

            } else {

                z.attackCooldown -= dt;

                if (z.attackCooldown <= 0) {

                    z.attackCooldown = 0.7;

                    target.health -= 10;

                    if (target.health <= 0) {

                        target.health = 0;
                        target.alive = false;

                    }

                }

            }

        }

    }


    /* -------------------------
       BULLETS
    ------------------------- */

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b = bullets[i];

        b.x += b.vx * dt;
        b.y += b.vy * dt;

        b.life -= dt;

        let remove = false;


        if (
            b.life <= 0 ||
            b.x < 0 ||
            b.x > WORLD_W ||
            b.y < 0 ||
            b.y > WORLD_H
        ) {

            remove = true;

        }


        if (!remove) {

            for (
                let j = zombies.length - 1;
                j >= 0;
                j--
            ) {

                const z = zombies[j];

                const d =
                    Math.hypot(
                        b.x - z.x,
                        b.y - z.y
                    );

                if (d < z.radius + 7) {

                    z.health -= 30;

                    remove = true;

                    if (z.health <= 0) {

                        zombies.splice(j, 1);

                    }

                    break;

                }

            }

        }


        if (remove) {

            bullets.splice(i, 1);

        }

    }


    broadcastWorld();

}


/* =========================================================
   WORLD BROADCAST
========================================================= */

let worldTimer = 0;

function broadcastWorld() {

    if (!connection) return;

    worldTimer += 1;

    if (worldTimer < 2) return;

    worldTimer = 0;

    connection.send({

        type: "world",

        players,
        zombies

    });

}


/* =========================================================
   CLIENT UPDATE
========================================================= */

function updateClient(dt) {

    const p = players[myId];

    if (!p || !p.alive) return;


    let dx = 0;
    let dy = 0;


    if (keys["w"] || keys["arrowup"]) {
        dy -= 1;
    }

    if (keys["s"] || keys["arrowdown"]) {
        dy += 1;
    }

    if (keys["a"] || keys["arrowleft"]) {
        dx -= 1;
    }

    if (keys["d"] || keys["arrowright"]) {
        dx += 1;
    }


    if (
        Math.abs(joyX) > 0.05 ||
        Math.abs(joyY) > 0.05
    ) {

        dx = joyX;
        dy = joyY;

    }


    const length =
        Math.hypot(dx, dy);

    if (length > 0) {

        dx /= length;
        dy /= length;

        p.x +=
            dx * p.speed * dt;

        p.y +=
            dy * p.speed * dt;

    }


    p.x =
        Math.max(
            p.radius,
            Math.min(
                WORLD_W - p.radius,
                p.x
            )
        );

    p.y =
        Math.max(
            p.radius,
            Math.min(
                WORLD_H - p.radius,
                p.y
            )
        );


    if (
        mouse.down ||
        firePressed ||
        keys[" "]
    ) {

        tryShoot();

    }


    p.shootCooldown =
        Math.max(
            0,
            p.shootCooldown - dt
        );


    sendPlayerState(dt);

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now) {

    if (!running) return;

    const dt =
        Math.min(
            (now - lastTime) / 1000,
            0.05
        );

    lastTime = now;


    if (isHost) {

        updateHost(dt);

    } else {

        updateClient(dt);

    }


    updateCamera();

    draw();

    updateHUD();

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    const p = players[myId];

    if (!p) return;

    camera.x =
        p.x - W / 2;

    camera.y =
        p.y - H / 2;


    camera.x =
        Math.max(
            0,
            Math.min(
                WORLD_W - W,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                WORLD_H - H,
                camera.y
            )
        );

}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* -------------------------
       BACKGROUND
    ------------------------- */

    ctx.fillStyle = "#10161a";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* -------------------------
       GRID
    ------------------------- */

    const grid = 80;

    ctx.strokeStyle =
        "rgba(255,255,255,.045)";

    ctx.lineWidth = 1;

    for (
        let x =
            -camera.x % grid;
        x < W;
        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);

        ctx.stroke();

    }


    for (
        let y =
            -camera.y % grid;
        y < H;
        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(W, y);

        ctx.stroke();

    }


    /* -------------------------
       WORLD BORDER
    ------------------------- */

    ctx.strokeStyle = "#45524a";
    ctx.lineWidth = 5;

    ctx.strokeRect(
        -camera.x,
        -camera.y,
        WORLD_W,
        WORLD_H
    );


    /* -------------------------
       BULLETS
    ------------------------- */

    for (const b of bullets) {

        ctx.fillStyle = "#ffe66d";

        ctx.beginPath();

        ctx.arc(
            b.x - camera.x,
            b.y - camera.y,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* -------------------------
       ZOMBIES
    ------------------------- */

    for (const z of zombies) {

        const x =
            z.x - camera.x;

        const y =
            z.y - camera.y;


        ctx.fillStyle = "#76b852";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            z.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle = "#111";

        ctx.beginPath();
        ctx.arc(x - 6, y - 4, 3, 0, Math.PI * 2);
        ctx.arc(x + 6, y - 4, 3, 0, Math.PI * 2);
        ctx.fill();


        /* health */

        ctx.fillStyle = "#222";

        ctx.fillRect(
            x - 20,
            y - 30,
            40,
            5
        );

        ctx.fillStyle = "#ef5350";

        ctx.fillRect(
            x - 20,
            y - 30,
            40 *
            Math.max(
                0,
                z.health / z.maxHealth
            ),
            5
        );

    }


    /* -------------------------
       PLAYERS
    ------------------------- */

    for (const id in players) {

        const p = players[id];

        if (!p.alive) continue;

        const x =
            p.x - camera.x;

        const y =
            p.y - camera.y;


        /* gun */

        ctx.save();

        ctx.translate(x, y);

        ctx.rotate(p.angle);

        ctx.fillStyle = "#222";

        ctx.fillRect(
            5,
            -5,
            28,
            10
        );

        ctx.restore();


        /* player */

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.strokeStyle =
            id === myId
                ? "#ffffff"
                : "rgba(255,255,255,.4)";

        ctx.lineWidth = 2;

        ctx.stroke();


        /* name */

        ctx.fillStyle = "white";

        ctx.font =
            "bold 13px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            p.name,
            x,
            y - 30
        );


        /* health */

        ctx.fillStyle = "#222";

        ctx.fillRect(
            x - 22,
            y + 27,
            44,
            5
        );

        ctx.fillStyle = "#4fd35b";

        ctx.fillRect(
            x - 22,
            y + 27,
            44 *
            Math.max(
                0,
                p.health / p.maxHealth
            ),
            5
        );

    }


    /* -------------------------
       DEAD MESSAGE
    ------------------------- */

    const me = players[myId];

    if (me && !me.alive) {

        ctx.fillStyle =
            "rgba(0,0,0,.55)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.fillStyle = "white";

        ctx.font =
            "bold 34px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "OYUNCU DÜŞTÜ",
            W / 2,
            H / 2
        );

    }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    const p = players[myId];

    if (!p) return;

    healthText.textContent =
        Math.max(
            0,
            Math.floor(p.health)
        );

    healthFill.style.width =
        Math.max(
            0,
            Math.min(
                100,
                p.health
            )
        ) + "%";

    zombieText.textContent =
        zombies.length;

}


/* =========================================================
   DISCONNECT
========================================================= */

disconnectBtn.addEventListener("click", () => {

    running = false;

    connected = false;

    if (connection) {

        connection.close();

    }

    if (peer) {

        peer.destroy();

    }

    location.reload();

});


/* =========================================================
   PREVENT MOBILE SCROLL / ZOOM
========================================================= */

document.addEventListener(
    "touchmove",
    e => {
        e.preventDefault();
    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturestart",
    e => {
        e.preventDefault();
    }
);


/* =========================================================
   INITIAL
========================================================= */

setStatus(
    "Oda oluştur veya arkadaşının odasına katıl."
);
</script>
